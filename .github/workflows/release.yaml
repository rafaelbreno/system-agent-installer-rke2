on:
  release:
    types: [published]

name: Release Build and Push
permissions:
    contents: read
    id-token: write

env:
  IMAGE: system-agent-installer-rke2
  REPO: rafiusky


jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        os: [ linux ]
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix the not-a-git-repository issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "OS=${{ matrix.os }}"     >> "$GITHUB_ENV"

      - name: Download installer
        run: scripts/download

      - name: Publish Image - Docker
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.ref_name }}
          make-target: push-image

          public-repo: ${{ env.REPO }}
          public-username: ${{ secrets.DOCKER_USERNAME }}
          public-password: ${{ secrets.DOCKER_PASSWORD }}
          push-to-prime: false

  build-windows:
    strategy:
      matrix:
        include:
          - NANOSERVER_VERSION: 1809
            TAG_SUFFIX: windows-1809-amd64
            RUNNER: windows-2022
          - NANOSERVER_VERSION: ltsc2022
            TAG_SUFFIX: windows-ltsc2022-amd64
            RUNNER: windows-2022
    runs-on: ${{ matrix.RUNNER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix the not-a-git-repository issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set environment variables
        run: |
          "ARCH=amd64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download installer
        run: scripts/windows/download.ps1

      - name: Publish Image - Docker
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
          NANOSERVER_VERSION: ${{ matrix.NANOSERVER_VERSION }}
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.ref_name }}
          make-target: push-image-windows

          public-repo: ${{ env.REPO }}
          public-username: ${{ secrets.DOCKER_USERNAME }}
          public-password: ${{ secrets.DOCKER_PASSWORD }}
          push-to-prime: false

  create-docker-manifest:
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          . scripts/version

      - name: Publish Manifest - Docker
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
          NANOSERVER_VERSION: ${{ matrix.NANOSERVER_VERSION }}
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.ref_name }}
          make-target: publish-manifest

          public-repo: ${{ env.REPO }}
          public-username: ${{ secrets.DOCKER_USERNAME }}
          public-password: ${{ secrets.DOCKER_PASSWORD }}
          push-to-prime: false

      - name: Inspect Docker image
        run: docker buildx imagetools inspect ${{ env.REPO }}/${{ env.IMAGE }}:${{ env.VERSION }}
